name: admin-frontend

services:
  admin-frontend:
    image: just2beeandrew/admin-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mypixelgram-admin-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://admin.mypixelgram.ru
      NEXT_PUBLIC_GRAPHQL_URL: /api/v1/graphql
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - admin-network

  nginx:
    image: nginx:1.27-alpine
    container_name: mypixelgram-admin-nginx
    ports:
      - "3667:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin-frontend
    restart: unless-stopped
    networks:
      - admin-network
      - mypixelgram-network

networks:
  admin-network:
    driver: bridge
  mypixelgram-network:
    external: true
    name: mypixelgram-network